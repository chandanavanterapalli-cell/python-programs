<!DOCTYPE html>
<html>
<head>
    <title>Add Product - InstantThings</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fb;
        }

        header {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 45px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2575fc;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2575fc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #125bd1;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2575fc;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>

    <h2>🛒 INSTANTTHINGS</h2>

    <div>
        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('product_list') }}">
            Products
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>
    </div>

</header>


<div class="container">

    <div class="card">

        <h1>➕ Add New Product</h1>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <label>
                Product Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter product name"
                required
            >


            <label>
                Price (₹)
            </label>

            <input
                type="number"
                name="price"
                placeholder="Enter price"
                min="0"
                step="0.01"
                required
            >


            <label>
                Stock
            </label>

            <input
                type="number"
                name="stock"
                placeholder="Enter stock quantity"
                min="0"
                required
            >


            <label>
                Category
            </label>

            <select name="category" required>

                <option value="Groceries">
                    🍚 Groceries
                </option>

                <option value="Dairy">
                    🥛 Dairy
                </option>

                <option value="Snacks">
                    🍪 Snacks
                </option>

                <option value="Beverages">
                    🥤 Beverages
                </option>

                <option value="Fruits">
                    🍎 Fruits
                </option>

                <option value="Vegetables">
                    🥕 Vegetables
                </option>

                <option value="Personal Care">
                    🧴 Personal Care
                </option>

                <option value="Other">
                    🛍️ Other
                </option>

            </select>


            <label>
                Product Image
            </label>

            <input
                type="file"
                name="image"
                accept="image/*"
            >


            <button type="submit">
                ➕ Add Product
            </button>

        </form>


        <a
            href="{{ url_for('product_list') }}"
            class="back"
        >
            ← Back to Products
        </a>

    </div>

</div>

</body>
</html>
