
<!DOCTYPE html>
<html>

<head>

    <title>Login - InstantThings</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff8e1,
                    #e1f5fe,
                    #e8f5e9
                );
        }

        .login-box {
            width: 90%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.18);
        }

        .logo {
            font-size: 38px;
            font-weight: bold;

            color: #263238;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #78909c;

            margin-bottom: 30px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 2px solid #ddd;

            border-radius: 9px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #1976d2;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #1976d2,
                    #42a5f5
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .error {
            background: #ffebee;

            color: #c62828;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 15px;
        }

        .back {
            display: block;

            margin-top: 20px;

            color: #1976d2;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <div class="logo">
            🛒 InstantThings
        </div>

        <div class="subtitle">
            Admin Login
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/login"
        >

            <input
                type="text"
                name="username"
                placeholder="👤 Username"
                required
            >


            <input
                type="password"
                name="password"
                placeholder="🔒 Password"
                required
            >


            <button type="submit">
                🔐 Login
            </button>

        </form>


        <a
            href="/"
            class="back"
        >
            ← Back to Home
        </a>

    </div>

</body>

</html>
